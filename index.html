<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Valores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1>🔄 Convertidor de Valores</h1>

        <label>Categoría</label>
        <select id="categoria" onchange="actualizarUnidades()">
            <option value="temperatura">Temperatura</option>
            <option value="distancia">Distancia</option>
        </select>

        <label>Cantidad</label>
        <input type="number" id="cantidad" placeholder="Ingresa un valor" step="any" min="0">

        <div class="row">
            <div>
                <label>De</label>
                <select id="desde"></select>
            </div>
            <div>
                <label>A</label>
                <select id="hacia"></select>
            </div>
        </div>

        <button type="button" onclick="convertir()">Convertir</button>

        <div class="resultado" id="resultado">Resultado</div>
    </div>
    <script src="temperaturas.js"></script>
</body>
</html>
