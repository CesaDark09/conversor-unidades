<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Valores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

        <h1>🔄 Convertidor de Valores</h1>

        <select>
            <option>Dev2</option>

        </select>

        <label>Cantidad</label>

        <div class="row">

                <label>De</label>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
            </div>
            <div>
                <label>A</label>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
            </div>
        </div>

        <button type="button">Convertir</button>

        <div class="resultado">Resultado</div>
    </div>
</body>
</html>
